services:
  - type: web
    name: anss-trace-api
    runtime: docker
    dockerContext: backend
    dockerFilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anss-trace-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: ANSS2026!
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: anss-trace-db
    plan: free
