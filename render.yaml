# render.yaml
services:
  - type: web
    name: anss-trace-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anss-trace-db
          property: connectionString

      - key: TOKEN_SECRET
        generateValue: true

      - key: ADMIN_USER
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: anss-trace-db
    plan: free
    region: frankfurt
